{% extends "base.html" %}{% block content %}
<h1>新建事件</h1>
{% if error %}<p style="color:#c00">{{ error }}</p>{% endif %}
<form method="post">
编号 <input name="id" required><br>
标题 <input name="title" required><br>
场景 <select name="scenario"><option value="closed-cohort">食堂/宴席</option><option value="distributed-retail">零售/分散</option></select><br>
负责人 <input name="lead"><br>
<button type="submit">建立事件</button></form>
{% endblock %}
